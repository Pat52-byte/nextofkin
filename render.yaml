services:
  - type: web
    name: nextofkin-service
    runtime: python
    rootDir: service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      # Secrets: set by hand in the Render dashboard, never stored in the repo.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SERVICE_API_KEY
        sync: false
      - key: PSEUDONYM_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
